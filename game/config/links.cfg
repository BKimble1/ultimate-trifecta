; Ultimate Trifecta's public links, shown in Settings > Privacy and in
; support messages.  The owner fills these in with real, monitored pages
; before submitting to the App Store (docs/APP_STORE.md).  Only https links
; are shown; an empty value is hidden, never replaced by a placeholder.  The
; game service's /v1/config can also supply them (PRIVACY_URL, SUPPORT_URL).
[links]
privacy_url=""
support_url=""
; 2.2: where "Report by email" goes when the moderation service isn't
