; Ultimate Trifecta online service (service/).  Left empty in source: the
; owner fills these in after deploying (service/README.md).  With no URL the
; game runs practice offline and online rooms work without verified profiles
; (clearly labelled), never against a stand-in service.
;
; Release builds name both deployments (docs/COMMERCE_SETUP.md section 3):
;   production_*  the App Store deployment (wrangler [env.production])
;   sandbox_*     the TestFlight / App Review sandbox deployment (default)
; The game picks one at launch from the App Store receipt kind and moves to
; the sandbox one by itself if the production one refuses a sandbox purchase
; (App Review).  Only public values belong here: the URLs and the admission
; PUBLIC keys (PEM, "\n" for line breaks).
; `url` / `admission_public_key` are a single-endpoint fallback for
; development, used only when neither pair is set.
[service]
production_url=""
production_admission_public_key=""
sandbox_url=""
sandbox_admission_public_key=""
url=""
admission_public_key=""
