name: Build, test and ship (iOS)

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight (needs App Store Connect secrets)"
        type: boolean
        default: false
      build_number:
        description: "CFBundleVersion override (default: next after App Store Connect's latest)"
        required: false
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  MARKETING_VERSION: "1.1"
  BUNDLE_ID: com.idlery.ultimatetrifecta

jobs:
  tests:
    name: Rules, simulation and network tests (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.cache/godot
          key: godot-linux-${{ env.GODOT_VERSION }}
      - name: Fetch Godot
        run: tools/fetch_godot.sh
      - name: Build native extension (UTShare, Linux)
        run: GODOT_BIN=$(cat tools/.cache/godot/BIN) tools/build_native.sh
      - name: Run tests
        run: GODOT_BIN=$(cat tools/.cache/godot/BIN) tools/run_tests.sh 2>&1 | tee test-output.txt
      - name: Fail on test failures
        run: grep -E "^[0-9]+ tests, [0-9]+ checks, 0 failures" test-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.txt

  ios:
    name: iOS export, simulator run, device archive${{ github.event.inputs.upload == 'true' && ', TestFlight upload' || '' }}
    needs: tests
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/cache@v4
        with:
          path: |
            tools/.cache/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-${{ env.GODOT_VERSION }}-templates
      - name: Fetch Godot + export templates
        run: tools/fetch_godot.sh --templates
      - name: Fetch pinned plugins
        run: tools/fetch_deps.sh
      - name: Build native extension (UTShare share sheet, iOS xcframework)
        run: GODOT_BIN=$(cat tools/.cache/godot/BIN) tools/build_native.sh
      - name: Signing configuration present?
        id: sign
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            # Homebrew Python is externally managed (PEP 668): use a venv
            python3 -m venv "$RUNNER_TEMP/ascenv"
            "$RUNNER_TEMP/ascenv/bin/pip" install --quiet pyjwt cryptography requests
            echo "ASC_PY=$RUNNER_TEMP/ascenv/bin/python" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No App Store Connect signing secrets configured: building unsigned (simulator + device compile only)."
          fi
      - name: Choose build number
        id: num
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          N="${{ github.event.inputs.build_number }}"
          if [ -z "$N" ] && [ "${{ steps.sign.outputs.available }}" = "true" ]; then
            export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            "$ASC_PY" tools/asc.py app || true
            N=$("$ASC_PY" tools/asc.py next-build 2>/dev/null || echo "")
          fi
          [ -z "$N" ] && N=${{ github.run_number }}
          echo "build=$N" >> "$GITHUB_OUTPUT"
          echo "CFBundleVersion: $N"
      - name: Export Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.num.outputs.build }}
        run: |
          export GODOT_BIN=$(cat tools/.cache/godot/BIN)
          tools/export_ios.sh
          ls build/ios
      - name: Device archive (unsigned arm64 compile + link check)
        if: steps.sign.outputs.available != 'true' || github.event.inputs.upload != 'true'
        run: |
          tools/build_ios.sh device
          APP=$(find build/ios/UltimateTrifecta-unsigned.xcarchive -name '*.app' | head -1)
          lipo -info "$APP/UltimateTrifecta" || file "$APP/UltimateTrifecta"
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | head -80
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          ls "$APP" | head -40
      - name: Build for iOS Simulator (x86_64, best effort)
        id: simbuild
        continue-on-error: true
        run: tools/build_ios.sh sim
      - name: Run in iOS Simulator (screenshots + video)
        if: steps.simbuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          APP=$(find build/ios/dd-sim -name '*.app' -maxdepth 6 | head -1)
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for r,l in d.items() if "iOS" in r for x in l if "iPhone" in x["name"]]; print(sorted(c,key=lambda x:x["name"])[-1]["udid"])')
          xcrun simctl list devices available | grep "$DEV" || true
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          mkdir -p sim-evidence
          # cold launch to the title screen first (Game Center skipped: no account on CI)
          xcrun simctl launch "$DEV" "$BUNDLE_ID" -- --no-gamecenter > /dev/null
          sleep 45
          xcrun simctl io "$DEV" screenshot sim-evidence/00_title.png || true
          echo "cold launch still running? $(xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | grep -c "$BUNDLE_ID")"
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i trifecta || echo "no crash report after cold launch"
          xcrun simctl terminate "$DEV" "$BUNDLE_ID" || true
          sleep 2
          # bot-driven practice round as a runner (labelled: iOS Simulator, x86_64, Release, unsigned)
          xcrun simctl io "$DEV" recordVideo --codec h264 --force sim-evidence/practice_bot_run_simulator.mp4 &
          REC=$!
          # the app's own status lines (match state, fps) arrive through the unified log
          xcrun simctl spawn "$DEV" log stream --style compact --level debug --predicate 'process == "UltimateTrifecta"' > sim-evidence/os_log.txt 2>&1 &
          LOGP=$!
          xcrun simctl launch --console-pty "$DEV" "$BUNDLE_ID" -- --no-gamecenter --autoplay=runner --local-bot --report=user://sim_report.json > sim-evidence/app-console.log 2>&1 &
          for i in $(seq 1 16); do sleep 30; xcrun simctl io "$DEV" screenshot "sim-evidence/run_$(printf %02d $i).png" || true; done
          kill $LOGP || true
          kill -INT $REC || true
          sleep 3
          xcrun simctl terminate "$DEV" "$BUNDLE_ID" || true
          ls -la sim-evidence
          echo "---- app console (tail) ----"
          tail -n 120 sim-evidence/app-console.log || true
          echo "---- app status lines (os_log) ----"
          grep -E "SOAK|ROUND|SCRIPT ERROR|ERROR:" sim-evidence/os_log.txt | tail -n 60 || echo "no app status lines in os_log"
          echo "---- crash reports ----"
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E "trifecta|godot" || echo "none"
          mkdir -p sim-evidence/crash
          for f in ~/Library/Logs/DiagnosticReports/UltimateTrifecta*.ips; do
            [ -f "$f" ] || continue
            cp "$f" sim-evidence/crash/
            python3 tools/ips_summary.py "$f" || head -c 3000 "$f"
          done
      - name: Evidence contact sheet (base64 JPEG in log)
        if: steps.simbuild.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import base64, glob, io
          from PIL import Image
          files = sorted(glob.glob("sim-evidence/*.png"))
          if not files:
              raise SystemExit("no screenshots")
          W, cols = 300, 4
          thumbs = []
          for f in files:
              im = Image.open(f).convert("RGB")
              thumbs.append(im.resize((W, int(im.height * W / im.width))))
          h = max(t.height for t in thumbs)
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new("RGB", (W * cols, h * rows), (0, 0, 0))
          for i, t in enumerate(thumbs):
              sheet.paste(t, ((i % cols) * W, (i // cols) * h))
          sheet.save("sim-evidence/contact_sheet.jpg", quality=55)
          buf = io.BytesIO(); sheet.save(buf, "JPEG", quality=40)
          print("CONTACT_SHEET_FILES", " ".join(f.split("/")[-1] for f in files))
          print("CONTACT_SHEET_BEGIN")
          b = base64.b64encode(buf.getvalue()).decode()
          for i in range(0, len(b), 1000):
              print(b[i:i+1000])
          print("CONTACT_SHEET_END")
          PY
      - name: Build facts (toolchain, binary, plist, privacy manifest)
        if: always()
        continue-on-error: true
        run: |
          echo "BUILD_FACTS_BEGIN"
          xcodebuild -version; echo "iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          APP=$(find build/ios -path '*xcarchive*' -name '*.app' -maxdepth 6 | head -1)
          [ -n "$APP" ] && { lipo -info "$APP/UltimateTrifecta"; du -sh "$APP";
            for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion DTSDKName DTXcode UIDeviceFamily ITSAppUsesNonExemptEncryption NSGKFriendListUsageDescription UISupportedInterfaceOrientations; do
              echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null | tr '\n' ' ')"; done
            ls "$APP/Frameworks" 2>/dev/null; [ -f "$APP/Frameworks/UTShare.framework/UTShare" ] && { echo "UTShare embedded:"; lipo -info "$APP/Frameworks/UTShare.framework/UTShare"; } || echo "UTShare framework NOT embedded"; find "$APP" -name 'PrivacyInfo.xcprivacy' | sed "s|$APP/||"; }
          find build/ios -name '*.entitlements' -maxdepth 3 -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
          PM=$(find build/ios -maxdepth 3 -name PrivacyInfo.xcprivacy | head -1); [ -n "$PM" ] && { echo "== $PM"; plutil -convert json -o - "$PM"; echo; }
          echo "BUILD_FACTS_END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence-${{ steps.num.outputs.build }}
          path: |
            sim-evidence
            build/ios/export.log
      - name: Signed archive + upload to TestFlight
        if: steps.sign.outputs.available == 'true' && github.event.inputs.upload == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPORT_DESTINATION: upload
          # first delivery is for the owner's internal testers only
          INTERNAL_ONLY: "true"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # register the bundle ID with the Game Center capability if it is new
          "$ASC_PY" tools/asc.py ensure-bundle || echo "::warning::could not register $BUNDLE_ID via the API (Xcode automatic signing will try)"
          if ! "$ASC_PY" tools/asc.py app; then
            echo "::error::No App Store Connect app record for $BUNDLE_ID. Create it in App Store Connect (Apps > + > New App, platform iOS, bundle ID $BUNDLE_ID), then re-run this workflow with upload=true."
            exit 1
          fi
          tools/build_ios.sh signed
      - name: Wait for App Store Connect processing + internal testers
        if: steps.sign.outputs.available == 'true' && github.event.inputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          set +e
          "$ASC_PY" tools/asc.py wait "$MARKETING_VERSION" "${{ steps.num.outputs.build }}" 2400
          RC=$?
          "$ASC_PY" tools/asc.py builds | head -40
          if [ $RC -eq 0 ]; then
            BID=$("$ASC_PY" tools/asc.py builds | python3 -c 'import json,sys; b=[x for x in json.load(sys.stdin) if str(x["build"])=="${{ steps.num.outputs.build }}"]; print(b[0]["id"] if b else "")')
            [ -n "$BID" ] && "$ASC_PY" tools/asc.py internal "$BID"
          fi
          exit 0
