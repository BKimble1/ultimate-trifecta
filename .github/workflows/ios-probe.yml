name: macOS toolchain probe
on:
  push:
    branches: [claude/ultimate-trifecta-testflight-oie9r7]
    paths: [".github/workflows/ios-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Toolchain
        run: |
          sw_vers; uname -m
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes | head -20
          xcrun simctl list devicetypes | grep -i iphone | tail -8
      - name: Plugin releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R migueldeicaza/GodotApplePlugins --limit 8 || true
          TAG=$(gh release list -R migueldeicaza/GodotApplePlugins --limit 1 --json tagName -q '.[0].tagName')
          gh release view "$TAG" -R migueldeicaza/GodotApplePlugins --json assets -q '.assets[] | [.name, .size, .digest] | @tsv' || true
